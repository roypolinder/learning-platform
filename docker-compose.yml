# Development uses native PostgreSQL in WSL (see README). Compose is for running
# the packaged application and, later, isolated sandbox workers.
#
#   docker compose --profile app up --build        # app + containerized PostgreSQL
#
# Sandbox workers for untrusted code are intentionally not defined yet: they need
# resource limits, timeouts, network and filesystem isolation before they exist.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["app"]
    environment:
      POSTGRES_USER: learning_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: learning_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_platform"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://learning_platform:${POSTGRES_PASSWORD}@postgres:5432/learning_platform
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres-data:
