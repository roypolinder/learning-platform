    need: { query: something sweet without any animal products, expected: vegan-banana-bread }
    situation: { query: a flaky pastry to go with my coffee in the morning, expected: croissant }
  vector: { query: something for a party, category: cake, expected: birthday-cake, excluded: sandwich-platter }
  rag:
    fact: { question: "Are you open on Mondays?", answer_any: [closed, gesloten, "not open", "niet open"], source: about }
