# yaml-language-server: $schema=./schema/course.schema.json
id: build-mcp-server
version: 2.1.1
title: Build your own MCP server
summary: Expose the catalog of your site as MCP tools over Streamable HTTP, so any AI agent can search it — and let the platform connect to it as a client.
description: |
  In the second course you connected an agent to someone else's server. Now you build one.
  Your website already has a catalog API for browsers; an MCP server gives AI agents a door
  too. Any MCP-capable agent, in any editor or app, can then search the {{theme.items}} of
  {{theme.data.site.name}} without custom integration work.

  You use an official MCP SDK in your language to add an MCP endpoint with well-described tools,
  structured output and proper errors. The platform connects to it as an MCP client, lists your
  tools and calls them with arguments you haven't seen.
category: AI tooling
difficulty: intermediate
order: 11
estimated_minutes: 60
tags: [mcp, model-context-protocol, tools, streamable-http, agents]
objectives:
  - Implement an MCP server with tools over the Streamable HTTP transport
  - Write tool definitions with input and output schemas, and annotations
  - Return tool errors that a model can act on
  - Secure a remote MCP server appropriately
prerequisites:
  - title: Advanced skills
    course: agent-skills-advanced
glossary:
  - term: MCP SDK
    definition: An official library that implements the MCP protocol for you. You register tools and write their handlers.
  - term: initialize
    definition: The first request of every MCP session. Client and server exchange protocol versions and capabilities.
  - term: tools/list
    definition: The request a client uses to ask which tools a server offers.
  - term: tools/call
    definition: The request a client uses to call a tool with arguments.
  - term: outputSchema
    definition: A JSON Schema that describes the structured result of a tool, returned as `structuredContent`.
  - term: Annotations
    definition: Hints about a tool, such as `readOnlyHint` or `destructiveHint`, that help clients decide when to ask for confirmation.
  - term: isError
    definition: Marks a tool result as a failure the model can read and act on, as opposed to a protocol error.
  - term: DNS rebinding
    definition: An attack where a web page reaches a server on your own machine. Validating the `Origin` header blocks it.
extensions: [quiz, service]
help: |
  The learner adds an MCP endpoint to the server of their website project, using an official MCP
  SDK. Help them find the SDK's Streamable HTTP server example, register tools with input and
  output schemas, and test the server with an MCP inspector or their own agent before running
  the check. Don't write the server for them.

sections:
  - id: concepts
    title: Anatomy of an MCP server
    steps:
      - id: lifecycle
        type: explanation
        title: What happens on the wire
        estimated_minutes: 7
        body: |
          An MCP server speaks JSON-RPC 2.0. With the **Streamable HTTP** transport, the client
          POSTs every message to one endpoint (by convention `/mcp`), and the server answers with
          plain JSON or a short stream of server-sent events.

          1. **initialize**: the client sends its protocol version and capabilities; the server
             answers with its own and may return an `Mcp-Session-Id` header that the client sends
             on every later request.
          2. **notifications/initialized**: the client confirms. Now real work can start.
          3. **tools/list**: the client asks which tools exist. Each has a `name`, a `description`,
             an `inputSchema` and optionally an `outputSchema` and `annotations`.
          4. **tools/call**: the client calls a tool with arguments and gets back `content` (text,
             images, …), optionally `structuredContent` matching the output schema, and `isError`
             when the tool failed.

          You don't implement any of this by hand. The official SDKs handle the protocol; you
          register tools and write their handlers — which can reuse the code behind your catalog
          and search endpoints.

      - id: two-doors
        type: diagram
        title: One catalog, two doors
        estimated_minutes: 2
        config:
          nodes:
            - { id: browser, label: Browsers, kind: person, row: 0, col: 0, detail: "Visitors use your pages and the JSON API you built in earlier courses." }
            - { id: agents, label: AI agents, kind: tool, row: 1, col: 0, detail: "Any MCP-capable agent: in an editor, a chat app or someone else's automation." }
            - { id: api, label: "/api/…", kind: app, row: 0, col: 1, detail: "Your existing HTTP endpoints." }
            - { id: mcp, label: "/mcp", kind: app, row: 1, col: 1, detail: "The new MCP endpoint: `search_items` and `get_item`." }
            - { id: catalog, label: "Catalog + search", kind: data, row: 0, col: 2, detail: "The same items and the same search code behind both doors." }
          edges:
            - { from: browser, to: api }
            - { from: agents, to: mcp, label: JSON-RPC }
            - { from: api, to: catalog }
            - { from: mcp, to: catalog }

      - id: design
        type: explanation
        title: Designing tools that agents use well
        estimated_minutes: 5
        body: |
          - **Fewer, sharper tools.** Every tool definition costs context in every request. Prefer
            a few tools built around user tasks (`search_items`) over one tool per database table
            or API endpoint.
          - **Output schemas.** Declare an `outputSchema` and return matching `structuredContent`
            alongside a readable text version. Clients can then validate and use the data
            directly.
          - **Annotations.** Hints such as `readOnlyHint`, `destructiveHint` and `idempotentHint`
            help clients decide when to ask the user for confirmation. They are hints, not
            security: the server still enforces what's allowed.
          - **Errors.** A tool that fails returns a normal result with `isError: true` and a
            message the model can act on: *"No {{theme.item}} with id x-99. Use search_items to
            find the id."* Protocol errors are for broken requests, not business failures.
          - **Security.** Remote servers need authentication (OAuth for user-facing servers), must
            validate the `Origin` header to block DNS rebinding, and should bind to localhost when
            they're only meant for local use.

      - id: check-concepts
        type: quiz
        title: Check your understanding
        estimated_minutes: 4
        config:
          pass_score: 0.75
          questions:
            - id: first
              prompt: Which request must a client send before it can list or call tools?
              explanation: Every session starts with initialize, followed by the initialized notification.
              options:
                - { id: init, text: "initialize", correct: true }
                - { id: list, text: "tools/list" }
                - { id: auth, text: "authorize" }
            - id: not-found
              prompt: get_item is called with an id that doesn't exist. What should the server return?
              explanation: Business failures are tool results with isError true and a helpful message, so the model can recover.
              options:
                - { id: rpc, text: "A JSON-RPC protocol error" }
                - { id: is-error, text: "A tool result with isError true and a helpful message", correct: true }
                - { id: http, text: "HTTP 404" }
            - id: annotations
              prompt: What does readOnlyHint true on a tool tell the client?
              explanation: It hints the tool doesn't modify anything, so a client may run it without asking. The server must still enforce access.
              options:
                - { id: safe, text: "The tool doesn't change anything, so it may be safe to run without confirmation", correct: true }
                - { id: cache, text: "The result can be cached forever" }
                - { id: enforce, text: "The server guarantees users can't write data" }
            - id: origin
              prompt: Why should an HTTP MCP server validate the Origin header?
              explanation: It blocks DNS rebinding attacks where a web page talks to a server on your machine.
              options:
                - { id: rebinding, text: "To block websites from reaching a local server through DNS rebinding", correct: true }
                - { id: cors, text: "To make responses faster" }
                - { id: version, text: "To negotiate the protocol version" }

  - id: build
    title: Build the server
    steps:
      - id: previous-course
        type: prerequisite
        title: Your expense skill works
        config:
          courses: [agent-skills-advanced]

      - id: tools
        type: explanation
        title: The tools
        estimated_minutes: 4
        body: |
          Add an MCP endpoint at `/mcp` to the server of {{theme.data.site.name}} with the
          Streamable HTTP transport, using the official MCP SDK for your language.

          **`search_items`**: input `query` (required, string) and `category` (optional, string).
          Finds matching {{theme.items}} by name, description or meaning — reuse your search code —
          and only in that category when one is given. Returns the matches with their ids and
          names, or a message that nothing matched.

          **`get_item`**: input `item_id` (required, string). Returns one item as text and as
          `structuredContent`, and declares an `outputSchema` (an object with at least `id`,
          `name`, `category` and `price`). An unknown id returns `isError: true` with a message
          that suggests using `search_items`.

          Both tools need clear descriptions (at least 40 characters) and the annotation
          `readOnlyHint: true`.

      - id: try-it
        type: manual_completion
        title: Try it with your own agent
        optional: true
        estimated_minutes: 5
        body: |
          Add your server next to `learning-platform` in your agent's MCP configuration. In
          `.mcp.json` (Claude Code, VS Code) that looks like this; other agents use the same
          entry in their own format, as in the MCP course:

          ```json
          {
            "mcpServers": {
              "learning-platform": { "type": "http", "url": "http://localhost:8080/mcp", "tools": ["*"] },
              "{{theme.id}}": { "type": "http", "url": "http://localhost:3000/mcp", "tools": ["*"] }
            }
          }
          ```

          Ask your agent *"Which {{theme.items}} of {{theme.data.site.name}} would suit
          {{theme.search_example}}?"* and watch which tools it calls. Mark this step done when it
          works.

      - id: server
        type: mcp_server_check
        title: Run the MCP checks
        estimated_minutes: 30
        depends_on: [tools]
        body: |
          Start your server and enter its base URL, for example `http://localhost:3000`. The
          platform completes the handshake, checks your tool definitions and calls the tools with
          ids and queries you haven't seen.
        help: |
          If the handshake fails, check that the server listens on /mcp with the Streamable HTTP
          transport (not stdio or the old SSE transport) and doesn't reject requests without an
          Origin header. If a tool check fails, compare the tools/list output with the requirements:
          descriptions, required parameters, outputSchema, annotations. If the unknown id check
          fails, the handler probably throws instead of returning isError. An MCP inspector is a good
          way to see the raw messages.
        config:
          path: /mcp
        validation:
          timeout_ms: 15000
          min_pass_ratio: 1.0
          tools:
            - name: search_items
              required_params: [query]
              min_description_length: 40
              json:
                - { pointer: /annotations/readOnlyHint, equals: true }
            - name: get_item
              required_params: [item_id]
              min_description_length: 40
              json:
                - { pointer: /annotations/readOnlyHint, equals: true }
                - { pointer: /outputSchema/type, equals: object }
          calls:
            - id: get-known
              label: get_item returns the right item with structured content
              tool: get_item
              arguments: { item_id: "{{theme.probes.catalog.item_id}}" }
              text_contains_any: ["{{theme.probes.catalog.item_name}}"]
              json:
                - { pointer: /structuredContent/name, equals: "{{theme.probes.catalog.item_name}}" }
                - { pointer: /structuredContent/price, approx: "{{theme.probes.catalog.item_price}}", tolerance: 0.001 }
            - id: get-unknown
              label: get_item reports an unknown id as a tool error
              tool: get_item
              arguments: { item_id: "missing-item-404" }
              expect_error: true
            - id: search-name
              label: search_items finds an item by its name
              tool: search_items
              arguments: { query: "{{theme.probes.catalog.item_name}}" }
              text_contains_any: ["{{theme.probes.catalog.item_id}}"]
            - id: search-category
              label: search_items only returns items of the requested category
              tool: search_items
              arguments: { query: "{{theme.data.items.0.name}}", category: "{{theme.probes.catalog.category}}" }
              json:
                - { pointer: /content/0/text, not_contains_any: ["{{theme.data.items.0.id}}"] }

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: Make it safe to share
        optional: true
        estimated_minutes: 3
        config:
          prompt: Your MCP server will be used by partners over the internet and gets a tool that makes a booking or order. What do you change for security?
        validation:
          min_words: 25
          required_concepts:
            - label: authentication or authorization
              any_of: [auth, oauth, token, login, permission, authorization, authentication]
      - id: finish
        type: automatic_completion
        title: Your site speaks MCP
        depends_on: [server]
        body: |
          Any MCP-capable agent can now search {{theme.data.site.name}}. Next, you build an agent
          of your own that plans and acts with these tools.
