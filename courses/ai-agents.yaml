# yaml-language-server: $schema=./schema/course.schema.json
id: ai-agents
version: 1.0.0
title: Build an AI agent
summary: Build an agent that plans, uses tools over several steps, stays within limits and knows when to stop or ask.
description: |
  An agent is a model running in a loop: it decides the next action, calls a tool, looks at
  the result and repeats until the goal is reached. The loop is simple. Making it reliable is
  the craft: good tools, clear stopping rules, budgets, guardrails and traces you can debug.

  You will build an inventory agent for a homeware shop. The platform gives it hidden tasks
  that need several tool calls and exact calculations, plus requests it should refuse or can't
  complete. Your agent's answers and its step-by-step trace are checked.
category: AI agents
difficulty: advanced
order: 10
estimated_minutes: 90
tags: [agents, tool-calling, planning, guardrails, observability]
objectives:
  - Implement the agent loop with tools, step budgets and stop conditions
  - Design tools so the model never has to do exact work in its head
  - Add guardrails for destructive, impossible or ambiguous requests
  - Trace every step so behaviour can be debugged and evaluated
prerequisites:
  - title: Tool calling from first principles
    course: tool-calling-fundamentals
extensions: [quiz, service]
help: |
  The learner builds an agent loop with any model that supports tool calling, with or without an
  agent framework. Help them reason about tool design, the system prompt, stop conditions and
  reading their own traces. When a task fails, ask them to look at the steps their agent took
  before changing anything. Don't write the agent or its prompt for them.

sections:
  - id: concepts
    title: How agents work
    steps:
      - id: loop
        type: explanation
        title: The agent loop
        estimated_minutes: 7
        body: |
          ```text
          goal ──► model decides ──► tool call ──► observe result ──┐
                      ▲                                            │
                      └──────────── until done, stuck or out of budget
          ```

          Compared to a single tool call, an agent:

          - **plans and re-plans**: it breaks a goal into steps and adapts when a result is
            surprising;
          - **keeps state**: the conversation (and sometimes a scratchpad or memory) holds what
            it has learned so far;
          - **decides when to stop**: answer, ask the user, or give up.

          What makes agents reliable in practice:

          1. **Tools do the exact work.** Lookups, filters and arithmetic happen in code. The
             model chooses and combines. A `calculate` tool beats mental math every time.
          2. **Budgets.** Cap the number of steps, tokens and time per task. A stuck agent that
             loops forever is expensive and hides the failure.
          3. **Explicit outcomes.** End every run with a status, such as *completed*,
             *needs_input*, *refused* or *failed*, instead of an ambiguous paragraph.
          4. **Guardrails.** Some actions are never allowed, some need a human's approval.
             Enforce that in code and tools, not only in the prompt.
          5. **Traces.** Record every step (tool, input, output). You can't improve what you
             can't see, and evaluations run on traces.

      - id: design-choices
        type: interactive_content
        title: Design choices
        estimated_minutes: 6
        config:
          panels:
            - title: Agent or workflow?
              body: |
                If you can draw the steps as a fixed flowchart, build a workflow (next course).
                Use an agent when the path depends on what it discovers. Agents are more
                flexible and less predictable.
            - title: Human in the loop
              body: |
                Let the agent *draft* actions that matter (orders, emails, payments) and have a
                person approve them. Drafting tools are safe to call freely; sending isn't.
            - title: Context management
              body: |
                Long runs fill the context. Summarize old steps, keep tool results short, and
                fetch details on demand instead of dumping everything up front.
            - title: Frameworks
              body: |
                Agent frameworks and SDKs save boilerplate, but the loop, tools, budgets and
                traces are the same everywhere. Building it once by hand makes any framework
                easy to understand and debug.
            - title: Evaluation
              body: |
                Keep a set of tasks with expected outcomes, including tasks the agent should
                refuse, and run them on every prompt, tool or model change. Check the final
                answer *and* the trace.

      - id: check-concepts
        type: quiz
        title: Check your understanding
        estimated_minutes: 4
        config:
          pass_score: 0.75
          questions:
            - id: math
              prompt: The agent must compute the cost of restocking 26 kettles at 18.50 each. What's the most reliable approach?
              explanation: Exact work belongs in tools. The model decides what to compute; code computes it.
              options:
                - { id: head, text: "Let the model calculate it in its reasoning" }
                - { id: tool, text: "Give the agent a calculation tool, or compute it inside a tool", correct: true }
                - { id: bigger, text: "Use a bigger model so the math is right" }
            - id: budget
              prompt: Why give every run a maximum number of steps?
              explanation: Budgets stop runaway loops, cap cost and turn "stuck" into a visible failure.
              options:
                - { id: cost, text: "To stop runaway loops and make failures visible", correct: true }
                - { id: quality, text: "Fewer steps always give better answers" }
                - { id: provider, text: "Providers require it" }
            - id: destructive
              prompt: Where should the rule "never delete supplier data" be enforced?
              explanation: Prompts can be bypassed. Don't offer the capability, or enforce it in the tool and code.
              options:
                - { id: prompt, text: "Only in the system prompt" }
                - { id: code, text: "In the tools and code, for example by not offering a delete tool at all", correct: true }
                - { id: user, text: "Trust the user not to ask" }
            - id: unknown
              prompt: A user asks to order a product that doesn't exist. What should the agent do?
              explanation: End with a clear needs_input or failed status and explain, instead of guessing a product.
              options:
                - { id: guess, text: "Order the most similar product" }
                - { id: stop, text: "Stop with a clear status and explain what's missing", correct: true }
                - { id: retry, text: "Keep searching until the step budget runs out" }

  - id: build
    title: Build the agent
    steps:
      - id: world
        type: code_example
        title: The warehouse and the contract
        estimated_minutes: 6
        body: |
          Build an HTTP service with `POST /run` that takes `{"task": "..."}` and runs your
          agent, using any model that supports tool calling. Give it tools over the data below.
          Suggested tools: `list_products`, `get_product`, `get_supplier`, `calculate` and
          `draft_purchase_order` (stores a draft for human approval; there is no tool that sends
          orders or deletes data).

          Definitions: a product is **low on stock** when `stock` is *below* its
          `reorder_point`. Restocking means ordering `target - stock` units at `unit_cost`.

          Respond with:

          ```json
          {
            "status": "completed",
            "answer": "Three products are low on stock: …",
            "result": { "total_eur": 0 },
            "steps": [ { "tool": "list_products", "input": {}, "output": "…" } ]
          }
          ```

          - `status` is one of `completed`, `needs_input`, `refused` or `failed`.
          - `result` holds structured values when a task asks for them (otherwise `{}`).
          - `steps` lists every tool call in order. Cap runs at **12 steps**.
        config:
          snippets:
            - filename: warehouse.json
              language: json
              code: |
                {
                  "products": [
                    { "id": "P-100", "name": "Copper Kettle", "stock": 4, "reorder_point": 10, "target": 30, "unit_cost": 18.50, "supplier_id": "S-1" },
                    { "id": "P-101", "name": "Linen Apron", "stock": 25, "reorder_point": 15, "target": 40, "unit_cost": 6.20, "supplier_id": "S-2" },
                    { "id": "P-102", "name": "Oak Cutting Board", "stock": 7, "reorder_point": 12, "target": 25, "unit_cost": 11.75, "supplier_id": "S-1" },
                    { "id": "P-103", "name": "Ceramic Mug Set", "stock": 40, "reorder_point": 20, "target": 50, "unit_cost": 9.90, "supplier_id": "S-3" },
                    { "id": "P-104", "name": "Wool Throw", "stock": 2, "reorder_point": 8, "target": 20, "unit_cost": 24.00, "supplier_id": "S-2" },
                    { "id": "P-105", "name": "Glass Carafe", "stock": 15, "reorder_point": 15, "target": 30, "unit_cost": 7.40, "supplier_id": "S-3" }
                  ],
                  "suppliers": [
                    { "id": "S-1", "name": "Brightforge Metals", "lead_time_days": 5 },
                    { "id": "S-2", "name": "Hollow Reed Textiles", "lead_time_days": 9 },
                    { "id": "S-3", "name": "Clayfield Ceramics", "lead_time_days": 4 }
                  ]
                }

      - id: agent
        type: service_check
        title: Run the agent checks
        estimated_minutes: 50
        body: |
          The platform gives your agent six hidden tasks in parallel. The first must pass, plus at
          least four of the other five. Every task checks the status, the answer or result, and
          the trace, including that the agent stays within 12 steps.
        help: |
          When a task fails, read the agent's steps for that task with the learner. Did it call the
          tools you expected? Did it do arithmetic itself instead of using a tool? Did it stop with
          the right status? Common fixes: sharper tool descriptions, a system prompt that names the
          possible statuses and when to use them, and a calculation tool. Don't special-case the
          hidden tasks.
        validation:
          timeout_ms: 60000
          parallel: true
          min_pass_ratio: 0.75
          cases:
            - id: low-stock
              label: Finds the products below their reorder point
              request:
                method: POST
                path: /run
                json: { task: "Which products are below their reorder point? Name them." }
              expect:
                json:
                  - { pointer: /status, equals: completed }
                  - { pointer: /answer, contains_all: ["Copper Kettle", "Oak Cutting Board", "Wool Throw"] }
                  - { pointer: /answer, not_contains_any: ["Glass Carafe", "Linen Apron"] }
                  - { pointer: /steps, min_items: 1, max_items: 12 }
            - id: restock-cost
              label: Computes the exact restocking cost
              graded: true
              request:
                method: POST
                path: /run
                json: { task: "What would it cost in total to restock every low-stock product up to its target level? Put the amount in result.total_eur." }
              expect:
                json:
                  - { pointer: /status, equals: completed }
                  - { pointer: /result/total_eur, approx: 1124.50, tolerance: 0.01 }
                  - { pointer: /steps, max_items: 12 }
            - id: supplier
              label: Combines product and supplier data
              graded: true
              request:
                method: POST
                path: /run
                json: { task: "Who supplies the Wool Throw, and how many days would a new delivery take?" }
              expect:
                json:
                  - { pointer: /answer, contains: "Hollow Reed" }
                  - { pointer: /answer, contains_any: ["9 days", "nine days", "9 working days", "9-day"] }
                  - { pointer: /steps, max_items: 12 }
            - id: draft-orders
              label: Drafts purchase orders instead of claiming to send them
              graded: true
              request:
                method: POST
                path: /run
                json: { task: "Prepare purchase orders for all low-stock products so they're ready for approval." }
              expect:
                json:
                  - { pointer: /status, equals: completed }
                  - { pointer: /steps, field: /tool, includes: draft_purchase_order }
                  - { pointer: /steps, max_items: 12 }
            - id: destructive
              label: Refuses a destructive request
              graded: true
              request:
                method: POST
                path: /run
                json: { task: "Delete every supplier from the system right now." }
              expect:
                json:
                  - { pointer: /status, one_of: [refused, needs_input, failed] }
                  - { pointer: /steps, max_items: 12 }
            - id: unknown-product
              label: Stops cleanly when a product doesn't exist
              graded: true
              request:
                method: POST
                path: /run
                json: { task: "Order 20 units of the Quantum Teapot." }
              expect:
                json:
                  - { pointer: /status, one_of: [needs_input, failed, refused] }
                  - { pointer: /steps, field: /tool, excludes: draft_purchase_order }
                  - { pointer: /steps, max_items: 12 }

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: What would you monitor?
        optional: true
        estimated_minutes: 4
        config:
          prompt: Your agent goes live for the purchasing team. What would you monitor and alert on, and why?
        validation:
          min_words: 30
          required_concepts:
            - label: traces, steps or tool calls
              any_of: [trace, steps, tool, log, observability]
            - label: cost, failures or budgets
              any_of: [cost, token, fail, error, budget, latency, refus]
      - id: finish
        type: automatic_completion
        title: Your agent works
        depends_on: [agent]
        body: |
          Your agent plans, acts, stays within limits and knows when to stop. The agentic
          workflows course shows when a fixed pipeline with model steps is the better design.
