# yaml-language-server: $schema=./schema/course.schema.json
id: tool-calling-fundamentals
version: 2.0.0
title: Tool calling
summary: Give a model tools over your own catalog with JSON Schema, run the tool loop yourself, and let the platform test both.
description: |
  Tool calling (also called function calling) is how a model goes from *talking* to *doing*:
  it asks your code to run a function, you run it, and you hand the result back. Every modern
  model API, MCP and every coding agent are built on this loop.

  You give a model three tools for {{theme.data.site.name}}: look up one of your {{theme.items}},
  list the catalog with filters, and convert prices to other currencies for foreign visitors.
  Then you connect a model of your choice and add a small chat endpoint to your site. The
  platform calls both with requests you haven't seen.
category: AI foundations
difficulty: beginner
order: 5
estimated_minutes: 60
tags: [tool-calling, function-calling, json-schema, agents]
objectives:
  - Explain the tool-calling loop and who executes what
  - Describe tools with JSON Schema so a model uses them correctly
  - Return structured, recoverable tool errors instead of crashing
  - Connect any model to your tools and keep it from calling tools it doesn't need
prerequisites:
  - title: Your first page and catalog API
    course: first-web-page
glossary:
  - term: Tool calling
    definition: A model answers with a request to run a function (name + arguments) instead of text. Your code runs it and returns the result. Also called function calling.
  - term: Tool definition
    definition: The name, description and JSON Schema of a tool. It is everything the model knows about the tool.
  - term: JSON Schema
    definition: A standard way to describe the shape of JSON, with types, required fields, enums and patterns.
  - term: Tool loop
    definition: Send the conversation and tools, run the calls the model asks for, send the results back, repeat until the model answers with text.
  - term: Tool result
    definition: What your code returns after running a tool. For problems, a clear error the model can act on.
  - term: System prompt
    definition: Instructions for the model that set its role and rules, sent before the user's messages.
  - term: Prompt injection
    definition: Text (for example in a document or user message) that tries to make a model ignore its instructions, for example to call tools it shouldn't.
  - term: API key
    definition: A secret that identifies you to a model provider. Keep it in `.env`, never in your code.
extensions: [quiz, service]
help: |
  The learner adds tool endpoints and a chat endpoint to the server of their website project.
  Help them reason about the tool-calling loop (model proposes a call, their code executes it,
  the result goes back to the model) and about JSON Schema. Encourage them to test with curl
  before running the platform check. Don't write their handlers or schemas for them.

sections:
  - id: concepts
    title: How tool calling works
    steps:
      - id: the-loop
        type: explanation
        title: The tool-calling loop
        estimated_minutes: 6
        body: |
          A model can't run code. What it *can* do is produce a structured request:
          "call `get_item` with `{"item_id": "{{theme.probes.catalog.item_id}}"}`". The loop looks
          like this:

          1. You send the conversation **plus a list of tool definitions** to the model.
          2. The model answers either with text, or with one or more **tool calls**.
          3. **Your code** validates the arguments and runs the function.
          4. You append the **tool result** to the conversation and call the model again.
          5. Repeat until the model answers with text (or you hit a step limit).

          Three things follow from this:

          - **You stay in control.** The model only proposes. Your code decides whether a call
            is allowed, validates every argument and can ask a human first.
          - **Definitions are prompts.** The tool name, description and parameter descriptions
            are all the model knows. Vague descriptions produce wrong calls.
          - **Errors are information.** A result like `"no {{theme.item}} with id x-99"` lets the
            model correct itself or tell the visitor. An HTTP 500 just breaks the loop.

      - id: order-the-loop
        type: diagram_exercise
        title: Put the loop in order
        estimated_minutes: 3
        config:
          mode: order
          prompt: "A visitor asks: “What does the {{theme.probes.catalog.item_name}} cost?” Put what happens in the right order."
          chips:
            - { id: send, label: Your code sends the question and the tool definitions to the model }
            - { id: call, label: "The model answers with a tool call: get_item" }
            - { id: run, label: Your code validates the arguments and runs get_item }
            - { id: result, label: Your code sends the tool result back to the model }
            - { id: answer, label: The model answers the visitor with text }
        validation:
          order: [send, call, run, result, answer]

      - id: good-definitions
        type: explanation
        title: Designing good tool definitions
        estimated_minutes: 5
        body: |
          **Name and description.** Use clear verb-noun names (`get_item`, not `items2`). The
          description says **what** the tool does, **when** to use it and what it returns:
          *"Look up one {{theme.item}} of {{theme.data.site.name}} by its id. Use when the visitor
          asks about a specific {{theme.item}}, its price or its details."*

          **Parameters.** The input is a JSON Schema object. Describe every property, mark required
          ones as `required`, and constrain values: `enum` for fixed choices, `pattern` for formats,
          `minimum` for numbers. Constraints prevent whole classes of bad calls.

          **Results.** Return small, structured results with only what the model needs. For
          failures, return an error the model can act on: what went wrong and what would work.

          **Safety.** Treat arguments as untrusted input, even though they come from "your" model.
          A prompt injection in a message can make a model call tools with hostile arguments.
          Validate, give tools only the permissions they need, and ask a human before anything
          destructive or expensive.

      - id: check-concepts
        type: quiz
        title: Check your understanding
        estimated_minutes: 4
        config:
          pass_score: 0.75
          questions:
            - id: executor
              prompt: Who actually runs the function when a model makes a tool call?
              explanation: The model only produces the call. Your application executes it and returns the result.
              options:
                - { id: model, text: "The model provider, on its servers" }
                - { id: app, text: "Your application code", correct: true }
                - { id: schema, text: "The JSON Schema validator" }
            - id: unknown-item
              prompt: A model calls get_item with an id that doesn't exist. What should your tool return?
              explanation: A structured error explains the problem so the model can recover or tell the visitor.
              options:
                - { id: crash, text: "Throw an exception so the request fails with HTTP 500" }
                - { id: empty, text: "An empty object" }
                - { id: error, text: "A tool result marked as an error, with a clear message", correct: true }
            - id: descriptions
              prompt: Why do parameter descriptions and enums matter so much?
              explanation: The definition is the model's only documentation. Constraints and descriptions steer it to valid calls.
              options:
                - { id: docs, text: "They are all the model knows about how to call the tool", correct: true }
                - { id: speed, text: "They make the model respond faster" }
                - { id: none, text: "They don't; models ignore them" }
            - id: injection
              prompt: Which practices protect you when a prompt injection tries to trigger a tool?
              multiple: true
              explanation: Validate arguments, keep tools narrowly scoped and confirm destructive actions with a human.
              options:
                - { id: validate, text: "Validate every argument server-side", correct: true }
                - { id: confirm, text: "Ask a human before destructive actions", correct: true }
                - { id: trust, text: "Trust arguments because your own model produced them" }
                - { id: scope, text: "Give tools only the permissions they need", correct: true }

  - id: build-tools
    title: Build the tools
    steps:
      - id: previous-course
        type: prerequisite
        title: Your catalog API works
        config:
          courses: [first-web-page]

      - id: contract
        type: code_example
        title: The tools and the contract
        estimated_minutes: 5
        body: |
          Add two endpoints to the server of {{theme.data.site.name}}:

          - `GET /tools` returns `{"tools": [...]}`. Each tool has `name`, `description` and
            `input_schema` (a JSON Schema object with `properties`).
          - `POST /tools/call` with `{"name": "...", "arguments": {...}}` returns HTTP 200
            with either `{"is_error": false, "content": {...}}` or
            `{"is_error": true, "error": "a helpful message"}`. Invalid input is a tool
            error, not an HTTP error, so a model can read it.

          **Tools:**

          - `get_item(item_id)` returns one item from `data/items.json`.
          - `list_items(category?, max_price?)` returns `{"items": [...]}` with the items that match
            both optional filters.
          - `convert_currency(amount, from, to)` with the fixed rates below. Currencies are `EUR`,
            `USD`, `GBP` and `JPY`. Returns `amount` (rounded to 2 decimals) and `currency`.
        config:
          snippets:
            - filename: Exchange rates
              language: json
              caption: Fixed rates per 1 EUR, so results are predictable.
              code: |
                { "EUR": 1.0, "USD": 1.08, "GBP": 0.86, "JPY": 162.5 }
            - filename: tool call example
              language: http
              code: |
                POST /tools/call
                {"name": "convert_currency", "arguments": {"amount": 10, "from": "EUR", "to": "GBP"}}

                200 OK
                {"is_error": false, "content": {"amount": 8.6, "currency": "GBP"}}

      - id: tool-server
        type: service_check
        title: Run the tool checks
        estimated_minutes: 20
        body: |
          Start your server and enter its base URL. The platform reads your tool definitions and
          makes calls you haven't seen: valid ones, an unknown {{theme.item}}, a missing argument,
          filters, an unsupported currency and a tool that doesn't exist.
        help: |
          Likely sticking points: `input_schema` must be an object schema with `properties`;
          invalid input must return HTTP 200 with `is_error: true` (not a 4xx/5xx); currency
          conversion between two non-EUR currencies goes through EUR; list_items must apply both
          filters. Ask which case failed and what the service returned for it.
        validation:
          timeout_ms: 5000
          cases:
            - id: list
              label: Lists the three tools with descriptions and object schemas
              request: { path: /tools }
              expect:
                json:
                  - { pointer: /tools, field: /name, includes_all: [get_item, list_items, convert_currency] }
                  - { pointer: "/tools/*/description", min_length: 40 }
                  - { pointer: "/tools/*/input_schema/type", equals: object }
                  - { pointer: "/tools/*/input_schema/properties", type: object }
            - id: get-item
              label: Looks up one item
              request:
                method: POST
                path: /tools/call
                json: { name: get_item, arguments: { item_id: "{{theme.probes.catalog.item_id}}" } }
              expect:
                json:
                  - { pointer: /is_error, equals: false }
                  - { pointer: /content/name, equals: "{{theme.probes.catalog.item_name}}" }
                  - { pointer: /content/price, approx: "{{theme.probes.catalog.item_price}}", tolerance: 0.001 }
            - id: unknown-item
              label: Reports an unknown item as a recoverable tool error
              request:
                method: POST
                path: /tools/call
                json: { name: get_item, arguments: { item_id: "missing-{{nonce}}" } }
              expect:
                status: 200
                json:
                  - { pointer: /is_error, equals: true }
                  - { pointer: /error, min_length: 10 }
            - id: missing-argument
              label: Rejects a call with a missing argument
              request:
                method: POST
                path: /tools/call
                json: { name: get_item, arguments: {} }
              expect:
                status: 200
                json: [{ pointer: /is_error, equals: true }]
            - id: filter-category
              label: Lists the items of one category
              request:
                method: POST
                path: /tools/call
                json: { name: list_items, arguments: { category: "{{theme.probes.catalog.category}}" } }
              expect:
                json:
                  - { pointer: /is_error, equals: false }
                  - { pointer: /content/items, field: /id, includes_all: "{{theme.probes.catalog.category_ids}}" }
                  - { pointer: /content/items, field: /category, all_equal: "{{theme.probes.catalog.category}}" }
            - id: filter-price
              label: Applies a maximum price
              request:
                method: POST
                path: /tools/call
                json: { name: list_items, arguments: { max_price: 0.01 } }
              expect:
                json:
                  - { pointer: /is_error, equals: false }
                  - { pointer: /content/items, max_items: 0 }
            - id: convert
              label: Converts a currency through the fixed rates
              request:
                method: POST
                path: /tools/call
                json: { name: convert_currency, arguments: { amount: 129.90, from: EUR, to: USD } }
              expect:
                json:
                  - { pointer: /is_error, equals: false }
                  - { pointer: /content/amount, approx: 140.29, tolerance: 0.01 }
                  - { pointer: /content/currency, equals: USD }
            - id: cross-rate
              label: Converts between two non-euro currencies
              request:
                method: POST
                path: /tools/call
                json: { name: convert_currency, arguments: { amount: 50, from: GBP, to: JPY } }
              expect:
                json:
                  - { pointer: /content/amount, approx: 9447.67, tolerance: 0.05 }
            - id: bad-currency
              label: Rejects an unsupported currency
              request:
                method: POST
                path: /tools/call
                json: { name: convert_currency, arguments: { amount: 10, from: EUR, to: BTC } }
              expect:
                status: 200
                json: [{ pointer: /is_error, equals: true }]
            - id: unknown-tool
              label: Rejects a tool that doesn't exist
              request:
                method: POST
                path: /tools/call
                json: { name: delete_item, arguments: { item_id: "{{theme.probes.catalog.item_id}}" } }
              expect:
                status: 200
                json: [{ pointer: /is_error, equals: true }]

  - id: connect-model
    title: Connect a model
    steps:
      - id: chat-contract
        type: explanation
        title: Close the loop with a model
        estimated_minutes: 5
        body: |
          Now add `POST /api/chat` that takes `{"message": "..."}` and runs the loop with a model of
          your choice: a hosted API or a local model runner, as long as it supports tool calling.

          1. Send a system prompt, the visitor's message and your three tool definitions to the
             model. The system prompt says the assistant helps visitors of
             {{theme.data.site.name}} and only uses tools for questions about the catalog and prices.
          2. While the model returns tool calls, execute them **through your own executor**
             (the same validation as `/tools/call`) and send the results back.
          3. Stop when the model answers with text, or after **at most 6 rounds**. A loop without
             a limit can run up a large bill when a model gets stuck.

          Respond with:

          ```json
          {
            "answer": "The {{theme.probes.catalog.item_name}} costs …",
            "tool_calls": [ { "name": "get_item", "arguments": { "item_id": "{{theme.probes.catalog.item_id}}" } } ]
          }
          ```

          `tool_calls` lists every call the model made, in order. The platform uses it to check
          that the model used the tools, and didn't use them when it didn't need to.

          Keep your API key out of the code: read it from an environment variable in `.env`.

      - id: chat
        type: service_check
        title: Run the conversation checks
        estimated_minutes: 20
        body: |
          The platform sends four hidden questions to `/api/chat`. The first must pass and at least
          two of the other three. Models vary, so improve your system prompt and tool descriptions
          rather than special-casing questions.
        help: |
          If the model answers without calling tools, look at the tool descriptions and the system
          prompt together. If it calls tools for a general-knowledge question, the system prompt
          should say tools are only for the catalog and prices. If arithmetic is wrong, the model
          should use convert_currency instead of doing math itself. Let the learner inspect the raw
          model responses and the tool_calls list before changing code.
        validation:
          timeout_ms: 45000
          parallel: true
          min_pass_ratio: 0.66
          cases:
            - id: price
              label: Answers a price question by calling a catalog tool
              request:
                method: POST
                path: /api/chat
                json: { message: "Hi! How much is the {{theme.probes.catalog.item_name}}?" }
              expect:
                json:
                  - { pointer: /answer, contains_any: "{{theme.probes.catalog.price_mentions}}" }
                  - { pointer: /tool_calls, min_items: 1 }
            - id: chain
              label: Chains tools to give a price in US dollars
              graded: true
              request:
                method: POST
                path: /api/chat
                json: { message: "What does the {{theme.probes.catalog.item_name}} cost in US dollars?" }
              expect:
                json:
                  - { pointer: /tool_calls, field: /name, includes: convert_currency }
                  - { pointer: /tool_calls, min_items: 2 }
            - id: no-tools
              label: Doesn't call tools for an unrelated question
              graded: true
              request:
                method: POST
                path: /api/chat
                json: { message: "Can you give me a one-line definition of a haiku?" }
              expect:
                json:
                  - { pointer: /tool_calls, max_items: 0 }
                  - { pointer: /answer, min_length: 10 }
            - id: missing
              label: Tells the visitor when something doesn't exist
              graded: true
              request:
                method: POST
                path: /api/chat
                json: { message: "Can you tell me the price of item zx-404-{{nonce}}?" }
              expect:
                json:
                  - { pointer: /tool_calls, min_items: 1 }
                  - pointer: /answer
                    contains_any: ["not find", "couldn't find", "could not find", "doesn't exist", "does not exist", "not found", "unable to find", "no item", "isn't", "niet gevonden", "kan geen", "kon geen", "bestaat niet", "niet vinden", "geen item"]

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: Where would you draw the line?
        optional: true
        estimated_minutes: 3
        config:
          prompt: Name one tool for {{theme.data.site.name}} you would let a model call freely and one that should always need a human's confirmation. Explain why.
        validation:
          min_words: 25
          required_concepts:
            - label: risk, cost or destructiveness
              any_of: [destructive, delete, money, payment, irreversible, risk, cost, refund, send, booking, order]
      - id: finish
        type: automatic_completion
        title: Your model can act
        depends_on: [chat]
        body: |
          You built the loop every agent runs on. Next, you make search on
          {{theme.data.site.name}} understand what visitors *mean*.
