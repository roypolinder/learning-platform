# yaml-language-server: $schema=./schema/course.schema.json
id: semantic-matching
version: 2.0.0
title: Semantic search
summary: Make the search on your site understand what visitors mean, not just the words they type — and prove it on queries that share no words with your catalog.
description: |
  Keyword search fails the moment visitors use different words than your catalog. Someone
  searching for *"{{theme.search_example}}"* on {{theme.data.site.name}} may not use a single
  word from the {{theme.item}} they are looking for. Embeddings turn text into vectors where
  similar meaning lands close together, so you can search on meaning instead.

  You add a search endpoint to your site that ranks your {{theme.items}} by cosine similarity
  and knows when nothing matches. The platform tests it with hidden queries that avoid your
  catalog's wording — one of them in Dutch — and with questions that have nothing to do with
  your site.
category: AI foundations
difficulty: beginner
order: 6
estimated_minutes: 50
tags: [embeddings, semantic-search, similarity]
objectives:
  - Explain what an embedding is and why similar meanings end up close together
  - Compute and interpret cosine similarity
  - Rank items by similarity and choose a sensible "no match" threshold
  - Recognize where keyword search still beats semantic search
prerequisites:
  - title: Tool calling
    course: tool-calling-fundamentals
glossary:
  - term: Embedding
    definition: A list of numbers (a vector) that represents the meaning of a text. Texts with similar meaning get vectors that point in similar directions.
  - term: Embedding model
    definition: A model that turns text into embeddings. Queries and items must be embedded with the same model.
  - term: Vector
    definition: A list of numbers. An embedding usually has hundreds or thousands of them.
  - term: Cosine similarity
    definition: A score for how much two vectors point in the same direction. 1 is identical in meaning, 0 is unrelated.
  - term: Semantic search
    definition: Searching on meaning with embeddings, instead of on matching words.
  - term: Lexical search
    definition: Searching on matching words, for example with BM25. Strong for names, codes and rare terms.
  - term: Hybrid search
    definition: Combining lexical and semantic search and merging their rankings.
  - term: Threshold
    definition: The minimum similarity score for a result to count as a match. Below it, you return "no results".
  - term: Multilingual model
    definition: An embedding model trained on many languages, so a Dutch query can match an English description.
extensions: [quiz, service]
help: |
  The learner adds semantic search over their website's catalog, with any embedding model
  (hosted API or local). Help them understand vectors, cosine similarity and thresholds.
  Encourage printing the scores for a few queries to build intuition. Never hand them the
  threshold value or the full implementation.

sections:
  - id: concepts
    title: Meaning as geometry
    steps:
      - id: embeddings
        type: explanation
        title: What an embedding is
        estimated_minutes: 6
        body: |
          An **embedding model** turns a piece of text into a fixed-length list of numbers, a
          vector with hundreds or thousands of dimensions. It is trained so that texts with
          similar meaning get vectors pointing in similar directions.

          - *"My wheel lost all its air"* and *"What do I do with a flat tyre?"* share no
            important words, but their vectors are close.
          - *"Bank of the river"* and *"bank account"* share a word, but their vectors are far
            apart.

          To compare two vectors we usually use **cosine similarity**: the cosine of the angle
          between them. 1 means the same direction, 0 means unrelated. Many models return
          normalized vectors, in which case cosine similarity is just the dot product.

          A few rules that hold for every embedding model:

          - **Embed queries and items with the same model.** Vectors from different models (or
            versions) are not comparable. Switching models means re-embedding everything.
          - **Scores are relative to the model.** 0.45 can be a great match for one model and
            noise for another. You calibrate thresholds per model.
          - **Embed what you want to match on.** For your catalog, the name *and* the description
            (and maybe the tags) work much better than the name alone.
          - **Multilingual models** place a Dutch query close to an English description with the
            same meaning. Your visitors don't all search in English.

      - id: search-flow
        type: diagram
        title: How a semantic search works
        estimated_minutes: 3
        config:
          nodes:
            - { id: items, label: "Your {{theme.items}}", kind: data, row: 0, col: 0, detail: "Name + description + tags of every item, embedded **once** at startup." }
            - { id: embed-items, label: Embedding model, kind: model, row: 0, col: 1, detail: "Turns each item text into a vector." }
            - { id: vectors, label: Item vectors, kind: data, row: 0, col: 2, detail: "Kept in memory for now. A vector database comes in the next course." }
            - { id: query, label: Visitor's query, kind: person, row: 1, col: 0, detail: "For example: *{{theme.search_example}}*." }
            - { id: embed-query, label: Embedding model, kind: model, row: 1, col: 1, detail: "The **same** model, so the query vector is comparable with the item vectors." }
            - { id: rank, label: Cosine similarity + threshold, kind: tool, row: 1, col: 2, detail: "Score every item, sort best first, drop everything below your threshold." }
          edges:
            - { from: items, to: embed-items }
            - { from: embed-items, to: vectors }
            - { from: query, to: embed-query }
            - { from: embed-query, to: rank }
            - { from: vectors, to: rank, label: compare }

      - id: place-parts
        type: diagram_exercise
        title: Complete the search pipeline
        estimated_minutes: 3
        config:
          prompt: Drag the right labels into the empty boxes. Not every label is needed.
          nodes:
            - { id: query, label: Visitor's query, kind: person, row: 0, col: 0 }
            - { id: embed, slot: true, row: 0, col: 1 }
            - { id: compare, slot: true, row: 0, col: 2 }
            - { id: results, label: Ranked results, kind: data, row: 0, col: 3 }
          edges:
            - { from: query, to: embed }
            - { from: embed, to: compare, label: query vector }
            - { from: compare, to: results }
          chips:
            - { id: model, label: Embedding model }
            - { id: cosine, label: Cosine similarity with every item }
            - { id: keywords, label: Count matching words }
            - { id: chat, label: Chat model writes an answer }
        validation:
          slots: { embed: model, compare: cosine }

      - id: lexical-vs-semantic
        type: explanation
        title: Keywords, meaning or both?
        estimated_minutes: 4
        body: |
          **Lexical (keyword) search** matches exact terms, often with scoring such as BM25. It is
          strong for names, product codes and rare terms, and blind to synonyms and paraphrases.

          **Semantic search** matches meaning via embeddings. It is strong for natural questions
          and paraphrases, also across languages with multilingual models. It is weaker for exact
          identifiers and new jargon the model never saw.

          **Hybrid search** runs both and merges the rankings, for example with reciprocal rank
          fusion. That is the default in most production search, because it covers both failure
          modes.

          **Thresholds.** A ranker always returns *something*. To say "no results", look at the
          best score: below a threshold you calibrated on real queries, return nothing instead of
          a confident wrong answer.

      - id: check-concepts
        type: quiz
        title: Check your understanding
        estimated_minutes: 4
        config:
          pass_score: 0.75
          questions:
            - id: cosine
              prompt: What is the cosine similarity of the vectors [1, 0] and [0, 1]?
              explanation: They are perpendicular, so the angle is 90° and the cosine is 0 — unrelated.
              options:
                - { id: one, text: "1" }
                - { id: zero, text: "0", correct: true }
                - { id: minus, text: "-1" }
            - id: model-change
              prompt: You switch to a newer embedding model. What must you do with the stored item vectors?
              explanation: Vectors from different models live in different spaces and cannot be compared.
              options:
                - { id: nothing, text: "Nothing, vectors are model-independent" }
                - { id: reembed, text: "Re-embed all items with the new model", correct: true }
                - { id: normalize, text: "Normalize them again" }
            - id: identifier
              prompt: Visitors also search for exact item ids such as {{theme.probes.catalog.item_id}}. Which approach handles that best?
              explanation: Exact identifiers are lexical. Hybrid search keeps semantic matching for everything else.
              options:
                - { id: semantic, text: "Pure semantic search" }
                - { id: hybrid, text: "Hybrid: keyword matching combined with semantic search", correct: true }
                - { id: bigger, text: "A bigger embedding model" }
            - id: threshold
              prompt: Why calibrate a minimum similarity score?
              explanation: Ranking always returns a top result; a threshold lets you answer "no results" instead of guessing.
              options:
                - { id: speed, text: "To make search faster" }
                - { id: none, text: "So the search can return nothing instead of a wrong result", correct: true }
                - { id: storage, text: "To store fewer vectors" }

  - id: build
    title: Build the search
    steps:
      - id: previous-course
        type: prerequisite
        title: Your tools work
        config:
          courses: [tool-calling-fundamentals]

      - id: contract
        type: code_example
        title: The search endpoint
        estimated_minutes: 4
        body: |
          Add a search endpoint to your server. Use any embedding model, preferably a
          **multilingual** one: a hosted embeddings API or a local model.

          1. At startup, embed every item of `data/items.json` once — name, description and
             tags together — and keep the vectors in memory.
          2. `GET /api/search?q=<query>` embeds the query, scores every item with cosine
             similarity and responds with up to **5** results above your threshold, best first.
          3. When nothing is relevant, respond `{ "results": [] }`.

          Then add a search box to your home page that calls the endpoint. That part isn't
          checked, but it is the fun part: try a few searches of your own.
        config:
          snippets:
            - filename: GET /api/search?q=…
              language: json
              code: |
                { "results": [ { "id": "{{theme.probes.search.situation.expected}}", "score": 0.71 }, { "id": "{{theme.probes.catalog.item_id}}", "score": 0.44 } ] }
            - filename: cosine.js
              language: javascript
              caption: Cosine similarity in a few lines. Many models already return normalized vectors.
              code: |
                export function cosine(a, b) {
                  let dot = 0, normA = 0, normB = 0;
                  for (let i = 0; i < a.length; i++) {
                    dot += a[i] * b[i];
                    normA += a[i] * a[i];
                    normB += b[i] * b[i];
                  }
                  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
                }

      - id: search
        type: service_check
        title: Run the search checks
        estimated_minutes: 25
        body: |
          The platform sends hidden queries to `/api/search`. Most of them share no meaningful
          words with the right {{theme.item}}, so keyword search fails them; one is in Dutch.
          Two have nothing to do with {{theme.data.site.name}} and should return no results.

          The format check must pass, and at least two thirds of the meaning checks.
        help: |
          Common issues: embedding the query with a different model than the items; embedding only
          the name; sorting scores ascending; a threshold that is too high (no results for
          paraphrases) or too low (off-topic questions match). Suggest printing the top scores for
          a few of their own paraphrases and off-topic questions, and picking a threshold between
          the two groups.
        validation:
          timeout_ms: 15000
          parallel: true
          min_pass_ratio: 0.66
          cases:
            - id: format
              label: Returns at most 5 results, best first
              request: { path: /api/search, query: { q: "{{theme.data.items.0.name}}" } }
              expect:
                json:
                  - { pointer: /results, type: array, max_items: 5, min_items: 1 }
                  - { pointer: /results, field: /score, sorted: desc }
                  - { pointer: /results, top_k: 1, field: /id, includes: "{{theme.data.items.0.id}}" }
            - id: dutch
              label: A Dutch query finds the right {{theme.item}}
              graded: true
              request: { path: /api/search, query: { q: "{{theme.probes.search.dutch.query}}" } }
              expect:
                json: [{ pointer: /results, top_k: 3, field: /id, includes: "{{theme.probes.search.dutch.expected}}" }]
            - id: paraphrase
              label: A paraphrase without catalog words finds the right {{theme.item}}
              graded: true
              request: { path: /api/search, query: { q: "{{theme.probes.search.paraphrase.query}}" } }
              expect:
                json: [{ pointer: /results, top_k: 3, field: /id, includes: "{{theme.probes.search.paraphrase.expected}}" }]
            - id: need
              label: A described need finds the right {{theme.item}}
              graded: true
              request: { path: /api/search, query: { q: "{{theme.probes.search.need.query}}" } }
              expect:
                json: [{ pointer: /results, top_k: 3, field: /id, includes: "{{theme.probes.search.need.expected}}" }]
            - id: situation
              label: A described situation finds the right {{theme.item}}
              graded: true
              request: { path: /api/search, query: { q: "{{theme.probes.search.situation.query}}" } }
              expect:
                json: [{ pointer: /results, top_k: 3, field: /id, includes: "{{theme.probes.search.situation.expected}}" }]
            - id: off-topic-passport
              label: A question about passports returns no results
              graded: true
              request: { path: /api/search, query: { q: "How do I renew my passport?" } }
              expect:
                json: [{ pointer: /results, max_items: 0 }]
            - id: off-topic-geography
              label: A geography question returns no results
              graded: true
              request: { path: /api/search, query: { q: "What is the capital of Australia?" } }
              expect:
                json: [{ pointer: /results, max_items: 0 }]

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: When would keywords win?
        optional: true
        estimated_minutes: 3
        config:
          prompt: Describe a search on {{theme.data.site.name}} where keyword search would beat your semantic search, and how you would combine both.
        validation:
          min_words: 25
          required_concepts:
            - label: combining both (hybrid)
              any_of: [hybrid, combine, both, fusion, together, keyword]
      - id: finish
        type: automatic_completion
        title: Your search understands meaning
        depends_on: [search]
        body: |
          Visitors of {{theme.data.site.name}} can now search the way they talk. The next course
          moves the vectors into a vector database, with filters and live updates.
