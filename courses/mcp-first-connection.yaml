# yaml-language-server: $schema=./schema/course.schema.json
id: mcp-first-connection
version: 3.2.0
title: Connect your AI agent over MCP
summary: Learn how the Model Context Protocol works, connect your coding agent to the platform and let it fetch your project's seed data.
description: |
  The Model Context Protocol (MCP) is the open standard AI agents use to talk to tools and data.
  In this course you learn its building blocks, write a real client configuration, and connect
  the agent in your own editor to the platform's MCP server by signing in with OAuth.

  Then your agent puts that connection to work for {{theme.data.site.name}}: it fetches your
  project's seed data from the platform and saves it in your workspace. The platform notices
  the connection and checks the files — no screenshots, no copy-pasting tokens.
category: AI tooling
difficulty: beginner
order: 2
estimated_minutes: 30
tags: [mcp, agents, claude-code, vs-code, opencode, cursor, codex]
objectives:
  - Explain what MCP hosts, clients and servers are responsible for
  - Distinguish tools, resources and prompts
  - Configure an HTTP MCP server for your agent without storing secrets
  - Sign an agent in to a remote MCP server with OAuth and use its tools in your project
prerequisites:
  - title: Start your project
    course: project-setup
glossary:
  - term: MCP
    definition: Model Context Protocol. The open standard that lets AI agents use tools and data from other programs.
  - term: Host
    definition: The application you work in, such as Claude Code, VS Code, Cursor or OpenCode. It starts one MCP client per server.
  - term: MCP client
    definition: The connector inside the host that keeps a session with one MCP server.
  - term: MCP server
    definition: A program that offers tools, resources or prompts over MCP, like this learning platform.
  - term: Tool
    definition: A function the model can decide to call, with a name, a description and a JSON Schema for its input.
  - term: Resource
    definition: Read-only data, addressed by a URI, that the application can add as context.
  - term: Prompt
    definition: A reusable template the user picks explicitly, often shown as a slash command.
  - term: Streamable HTTP
    definition: The MCP transport for remote servers. The client sends JSON-RPC messages with HTTP POST to one endpoint.
  - term: JSON-RPC
    definition: A small protocol for calling methods with JSON messages. MCP messages are JSON-RPC 2.0.
  - term: OAuth
    definition: The standard for signing in an application on your behalf. Your agent gets an access token without you ever copying it.
extensions: [quiz, mcp, filesystem]
help: |
  The learner connects their own editor's agent to this platform over MCP. Help them with the
  configuration file format and location for their agent, starting the server and the OAuth
  sign-in. Explain concepts in your own words rather than giving quiz answers.

sections:
  - id: foundations
    title: How MCP works
    description: The vocabulary you need before wiring anything up.
    steps:
      - id: what-is-mcp
        type: explanation
        title: Why a protocol for agents?
        estimated_minutes: 4
        body: |
          Every AI coding agent needs context: your files, your issue tracker, your database schema.
          Before MCP, each agent shipped its own integrations, and every tool vendor had to build
          one plugin per agent.

          **MCP turns that N×M problem into N+M.** A tool exposes its capabilities once as an
          *MCP server*; any agent that speaks MCP can use it.

          Messages are JSON-RPC 2.0. Local servers usually run as a child process over *stdio*;
          remote servers, like ours, use the **Streamable HTTP** transport: the client POSTs requests
          to a single endpoint and the server answers with JSON or a stream of events.

          Remote servers also need to know **who** is calling. MCP uses OAuth 2.1 for that:

          1. The client calls the server without credentials and gets `401 Unauthorized`. The
             `WWW-Authenticate` header points to the server's *protected resource metadata*.
          2. That metadata names an *authorization server*, whose own metadata lists the sign-in,
             token and registration endpoints.
          3. The client registers itself, opens your browser to sign in and approve access, and
             receives an access token it sends as `Authorization: Bearer …` from then on.

          You never copy a token by hand, and nothing secret ends up in a configuration file.

      - id: roles
        type: diagram
        title: Host, client and server
        estimated_minutes: 3
        body: |
          This is the setup you are about to build. Select each box to see what it is
          responsible for.
        config:
          nodes:
            - { id: you, label: You, kind: person, row: 0, col: 0, detail: "You ask your agent something, in the chat of your editor or in the terminal." }
            - { id: host, label: "Your agent (host)", kind: app, row: 0, col: 1, detail: "The **host** is the application you work in, such as Claude Code, VS Code, Cursor or OpenCode. It runs the model conversation and starts one MCP client per configured server." }
            - { id: client, label: MCP client, kind: tool, row: 0, col: 2, detail: "The **client** keeps the session with one server: it signs in, lists the tools and sends the calls the model wants to make." }
            - { id: server, label: "Learning platform (server)", kind: app, row: 1, col: 2, detail: "The **server** offers tools such as `get_project` and `get_current_step`, and decides what each caller may see." }
            - { id: model, label: Language model, kind: model, row: 1, col: 1, detail: "The model only *proposes* tool calls. The host and client execute them." }
          edges:
            - { from: you, to: host, label: chat }
            - { from: host, to: model, label: prompt + tools }
            - { from: host, to: client }
            - { from: client, to: server, label: JSON-RPC over HTTP }

      - id: primitives
        type: explanation
        title: Tools, resources and prompts
        estimated_minutes: 4
        body: |
          An MCP server can offer three kinds of things:

          - **Tools** are functions the **model** decides to call, such as `create_issue` or
            `get_current_step`. Each tool has a name, a description and a JSON Schema for its
            input. Tools can have side effects, which is why hosts ask you before running them.
          - **Resources** are read-only data the **application** can attach as context: a file,
            a table schema, a log excerpt. They are addressed by URI, e.g. `file:///src/main.rs`.
          - **Prompts** are reusable templates the **user** picks explicitly, often shown as slash
            commands.

          A useful rule of thumb: tools are model-controlled, resources are application-controlled,
          prompts are user-controlled. Picking the right primitive is mostly a question of who
          should decide when it is used.

      - id: place-roles
        type: diagram_exercise
        title: Put the roles in place
        estimated_minutes: 3
        config:
          prompt: Drag each label to the right box. One label does not belong anywhere.
          nodes:
            - { id: you, label: You, kind: person, row: 0, col: 0 }
            - { id: host, slot: true, row: 0, col: 1 }
            - { id: client, slot: true, row: 0, col: 2 }
            - { id: server, slot: true, row: 1, col: 2 }
            - { id: model, label: Language model, kind: model, row: 1, col: 1 }
          edges:
            - { from: you, to: host, label: chat }
            - { from: host, to: model }
            - { from: host, to: client }
            - { from: client, to: server, label: JSON-RPC }
          chips:
            - { id: host, label: Host (your agent) }
            - { id: client, label: MCP client }
            - { id: server, label: MCP server (the platform) }
            - { id: resource, label: Resource }
        validation:
          slots: { host: host, client: client, server: server }

      - id: check-basics
        type: quiz
        title: Check your understanding
        estimated_minutes: 3
        config:
          pass_score: 0.6
          questions:
            - id: transport
              prompt: Which transport does a remote MCP server such as this platform use?
              explanation: Remote servers use Streamable HTTP; stdio only works for processes on your own machine.
              options:
                - { id: stdio, text: stdio }
                - { id: http, text: Streamable HTTP, correct: true }
                - { id: grpc, text: gRPC }
            - id: control
              prompt: Which primitive is typically invoked by the model on its own initiative?
              explanation: Tools are model-controlled. Hosts usually ask for confirmation before running them.
              options:
                - { id: tools, text: Tools, correct: true }
                - { id: resources, text: Resources }
                - { id: prompts, text: Prompts }
            - id: authorization
              prompt: How does an MCP client find out where to sign in to a remote server?
              explanation: The 401 response points to the protected resource metadata, which names the authorization server and its endpoints.
              options:
                - { id: challenge, text: "From the server's 401 response and its OAuth metadata", correct: true }
                - { id: config, text: You paste the sign-in URL into the configuration file }
                - { id: none, text: Remote MCP servers cannot require authentication }

      - id: review-basics
        type: conditional
        title: Quick review
        config:
          when: { step: check-basics, score_below: 1.0 }
        body: |
          You passed, but not every answer was right. Two things trip most people up:

          1. **stdio vs HTTP.** stdio requires the host to start the server as a local process.
             A platform running elsewhere can only be reached over HTTP.
          2. **Discovery.** Clients don't need to be told where to sign in. The server's `401`
             response leads them to the OAuth metadata, and from there to the sign-in page.

  - id: connect
    title: Connect your agent
    description: Configure your editor and prove the connection works.
    steps:
      - id: previous-course
        type: prerequisite
        title: Your project is ready
        config:
          courses: [project-setup]
        body: You need the project folder from "Start your project" for the rest of this course.

      - id: config-example
        type: code_example
        title: A configuration without secrets
        estimated_minutes: 4
        body: |
          Every agent keeps its MCP servers in a small configuration file in your project. The
          file name and the top-level key differ per agent, but each entry says the same three
          things: a **name** for the server, the **transport** (HTTP, because the platform is a
          remote server) and the **URL** of the endpoint. Pick the file of the agent you use;
          the panel in the next steps shows it with the right URL for you.

          Notice what is **not** in any of them: no token, no `Authorization` header and no
          prompt for a secret. The platform supports OAuth, so your agent signs you in through
          the browser and keeps the credentials itself. That makes the file safe to commit.
        config:
          snippets:
            - filename: .mcp.json
              language: json
              caption: Claude Code (terminal, desktop app or IDE extension) reads `.mcp.json` in the project root.
              code: |
                {
                  "mcpServers": {
                    "learning-platform": {
                      "type": "http",
                      "url": "http://localhost:8080/mcp"
                    }
                  }
                }
            - filename: .mcp.json
              language: json
              caption: VS Code with GitHub Copilot reads the same file; `tools` lists which tools the agent may use.
              code: |
                {
                  "mcpServers": {
                    "learning-platform": {
                      "type": "http",
                      "url": "http://localhost:8080/mcp",
                      "tools": ["*"]
                    }
                  }
                }
            - filename: opencode.json
              language: json
              caption: OpenCode calls remote servers `remote` and keeps them under `mcp`.
              code: |
                {
                  "$schema": "https://opencode.ai/config.json",
                  "mcp": {
                    "learning-platform": {
                      "type": "remote",
                      "url": "http://localhost:8080/mcp",
                      "enabled": true
                    }
                  }
                }
            - filename: .cursor/mcp.json
              language: json
              caption: Cursor recognises a remote server by its `url`.
              code: |
                {
                  "mcpServers": {
                    "learning-platform": {
                      "url": "http://localhost:8080/mcp"
                    }
                  }
                }
            - filename: .codex/config.toml
              language: toml
              caption: Codex uses TOML. `codex mcp add learning-platform --url …` writes this for you.
              code: |
                [mcp_servers.learning-platform]
                url = "http://localhost:8080/mcp"

      - id: config-blanks
        type: interactive_exercise
        title: Complete the server entry
        estimated_minutes: 2
        config:
          prompt: Fill in the missing values of this `.mcp.json` (the format Claude Code, VS Code and Cursor share).
          template: |
            {
              "{{root}}": {
                "learning-platform": {
                  "type": "{{transport}}",
                  "url": "http://localhost:8080/{{path}}",
                  "tools": ["*"]
                }
              }
            }
          blanks:
            - { id: root, hint: The top-level key that holds the server entries. }
            - { id: transport, hint: The transport type for remote servers. }
            - { id: path, hint: The endpoint path of the platform's MCP server. }
        validation:
          answers:
            root: [mcpServers]
            transport: [http]
            path: [mcp]

      - id: connect-agent
        type: mcp_connection_check
        title: Sign in and call a tool
        estimated_minutes: 5
        body: |
          1. Choose your agent in the panel below. Save the configuration it shows in your
             project folder, under the file name it shows.
          2. Start (or restart) your agent in that folder. It sees the `learning-platform` server
             and notices that it needs you to sign in; the panel says where to start that.
          3. Your browser opens this platform and asks you to allow access. Sign in if needed,
             then select **Allow**. Return to your agent once the page says you can close it.
          4. Ask your agent: **"Use the learning platform to show my current step."**

          Your agent calls `get_current_step`. As soon as it does, this step completes.
        help: |
          Ask which agent the learner uses. If the server doesn't show up, check the file name and
          location for that agent (.mcp.json for Claude Code and VS Code, opencode.json for
          OpenCode, .cursor/mcp.json for Cursor, ~/.codex/config.toml for Codex), the top-level key
          and the syntax. Most agents only read the file at start, so restart it. If sign-in
          doesn't start, check that the URL ends in /mcp and ask what the agent's MCP status or log
          shows (/mcp in Claude Code, "MCP: List Servers" in VS Code, `opencode mcp list`,
          `codex mcp list`).
        config:
          server_name: learning-platform
        validation:
          required_tool: get_current_step

      - id: fetch-project
        type: filesystem_validation
        title: Let your agent fetch your seed data
        estimated_minutes: 5
        body: |
          Now let the connection do something useful for {{theme.data.site.name}}. Ask your agent:

          > Use the learning platform's `get_project` tool. Save the catalog from the seed data as
          > `data/items.json` and the site pages as `data/pages.json`, exactly as they are. Then add
          > a short description of the site to `README.md`. When you're done, submit the files
          > for step `fetch-project`.

          Read the files your agent creates: this is the data your website will serve from the
          next course on, and the data the hidden checks expect.
        help: |
          The agent should copy `seed_data.items` and `seed_data.pages` from get_project unchanged,
          as JSON arrays. Then it submits data/items.json, data/pages.json and README.md with
          report_task_result. If a check fails, compare the file with the get_project output.
        validation:
          files:
            - path: data/items.json
              label: data/items.json contains the catalog
              contains: ["{{theme.probes.catalog.item_id}}", "{{theme.data.items.0.id}}"]
            - path: data/pages.json
              label: data/pages.json contains the site pages
              contains: ["{{theme.data.pages.0.id}}"]
            - path: README.md
              label: README.md describes {{theme.data.site.name}}
              min_length: 40
              contains: ["{{theme.data.site.name}}"]

      - id: verify-config
        type: configuration_validation
        title: Let your agent submit the configuration
        estimated_minutes: 3
        body: |
          Ask your agent: **"Submit my MCP configuration file to the learning platform for step
          verify-config."** It calls `report_task_result` with the file: `.mcp.json`,
          `opencode.json`, `.cursor/mcp.json` or `.vscode/mcp.json`. Codex keeps its
          configuration in your home folder; let it submit the `learning-platform` part as
          `.codex/config.toml`.

          The platform checks that the server uses HTTP, points at `/mcp`, and that no
          credentials are hardcoded in the file. Commit your work afterwards.
        config:
          variants:
            - { file: .mcp.json, format: json, label: "Claude Code, VS Code" }
            - { file: .vscode/mcp.json, format: json, label: VS Code }
            - { file: opencode.json, format: json, label: OpenCode }
            - { file: .cursor/mcp.json, format: json, label: Cursor }
            - { file: .codex/config.toml, format: toml, label: Codex }
        validation:
          variants:
            - file: .mcp.json
              rules:
                - { pointer: /mcpServers/*/type, equals: http, label: The server uses the HTTP transport }
                - { pointer: /mcpServers/*/url, contains: /mcp, label: The URL points at the MCP endpoint }
                - { pointer: /mcpServers/*/headers/Authorization, absent: true, label: "No token is hardcoded; the agent signs in with OAuth instead" }
            - file: .vscode/mcp.json
              rules:
                - { pointer: /servers/*/type, equals: http, label: The server uses the HTTP transport }
                - { pointer: /servers/*/url, contains: /mcp, label: The URL points at the MCP endpoint }
                - { pointer: /servers/*/headers/Authorization, absent: true, label: "No token is hardcoded; the agent signs in with OAuth instead" }
            - file: opencode.json
              rules:
                - { pointer: /mcp/*/type, equals: remote, label: The server is a remote (HTTP) server }
                - { pointer: /mcp/*/url, contains: /mcp, label: The URL points at the MCP endpoint }
                - { pointer: /mcp/*/headers/Authorization, absent: true, label: "No token is hardcoded; the agent signs in with OAuth instead" }
            - file: .cursor/mcp.json
              rules:
                - { pointer: /mcpServers/*/url, contains: /mcp, label: The URL points at the MCP endpoint }
                - { pointer: /mcpServers/*/command, absent: true, label: The server is reached over HTTP instead of started as a command }
                - { pointer: /mcpServers/*/headers/Authorization, absent: true, label: "No token is hardcoded; the agent signs in with OAuth instead" }
            - file: .codex/config.toml
              rules:
                - { pointer: /mcp_servers/*/url, contains: /mcp, label: The URL points at the MCP endpoint }
                - { pointer: /mcp_servers/*/command, absent: true, label: The server is reached over HTTP instead of started as a command }
                - { pointer: /mcp_servers/*/bearer_token, absent: true, label: "No token is hardcoded; the agent signs in with OAuth instead" }

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: Explain it to a colleague
        optional: true
        estimated_minutes: 3
        config:
          prompt: In two or three sentences, explain to a colleague why you would expose a capability as an MCP tool instead of building an editor plugin.
          placeholder: An MCP tool lets…
        validation:
          min_words: 20
          required_concepts:
            - label: reuse across agents or clients
              any_of: [agent, client, reuse, any, once]

      - id: finish
        type: automatic_completion
        title: You're connected
        depends_on: [verify-config]
        body: |
          Your agent can talk to the platform, and your workspace has the seed data for
          {{theme.data.site.name}}. Next, you teach your agent the conventions of your project
          with a skill.
