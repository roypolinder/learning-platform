# yaml-language-server: $schema=./schema/course.schema.json
id: multimodal-ai
version: 1.0.0
title: "Multimodal AI: from images to structured data"
summary: Use a vision-capable model to turn receipt images into validated JSON, and prove it on images you have never seen.
description: |
  Modern models don't just read text. They understand images, documents, audio and video in
  the same request. The most valuable everyday use is turning messy visual input into clean,
  structured data you can trust.

  You will build an extraction service that sends an image to a vision-capable model, asks
  for output that follows a JSON Schema, validates it and normalizes it. The platform sends it
  receipts it has never shown you, plus an image that isn't a receipt at all.
category: AI foundations
difficulty: intermediate
order: 30
estimated_minutes: 60
tags: [multimodal, vision, structured-outputs, document-ai, json-schema]
objectives:
  - Explain how models consume images, audio and video, and what it costs
  - Request structured output that follows a JSON Schema and validate it
  - Normalize dates, currencies and amounts so downstream code can rely on them
  - Recognize when input is out of scope instead of hallucinating fields
prerequisites:
  - title: Tool calling from first principles
    course: tool-calling-fundamentals
extensions: [quiz, service]
help: |
  The learner uses any vision-capable model (hosted or local). Help them with sending images
  (data URLs or base64), structured outputs or JSON-schema prompting, validation and
  normalization, and handling non-receipts. Encourage testing with a photo of a receipt
  of their own. Don't write the extraction prompt or the code for them.

sections:
  - id: concepts
    title: How multimodal models work
    steps:
      - id: modalities
        type: explanation
        title: One model, many kinds of input
        estimated_minutes: 6
        body: |
          A multimodal model turns every input into tokens it can reason over together:

          - **Images** are split into patches that become tokens. Higher resolution means
            more tokens, so more cost and latency, but small text stays legible. Many APIs let
            you pick a detail level.
          - **Documents** (PDFs, scans) are processed as images, as extracted text, or both.
            Layout matters: a total next to the word "TOTAL" means something.
          - **Audio** can be transcribed first, or understood natively, including tone and
            speaker changes.
          - **Video** is usually sampled as frames plus the audio track.

          The same model can also *produce* other modalities, but this course focuses on
          understanding, which is where most business value is today: invoices, forms,
          screenshots, photos of whiteboards, product images.

          Two habits make multimodal systems reliable:

          1. **Ask for structure.** Describe the output as a JSON Schema and use your
             provider's structured output or JSON mode where available. Free text is hard to
             validate.
          2. **Validate and normalize in code.** Parse the result, check types and ranges,
             convert dates to ISO 8601 and amounts to numbers, and retry or flag when
             validation fails. Never trust extracted values blindly.

      - id: risks
        type: interactive_content
        title: Pitfalls specific to visual input
        estimated_minutes: 5
        config:
          panels:
            - title: Hallucinated fields
              body: |
                Asked for a total, a model may invent one even if the image is a cat. Allow
                `null` in your schema and add an explicit "is this the expected document type?"
                field so the model has an honest way out.
            - title: Ambiguous formats
              body: |
                Is `03/04/2026` the 3rd of April or March 4th? Does `1.250,00` mean one thousand
                two hundred fifty? Use context (country, currency) and normalize to one format.
            - title: Prompt injection in images
              body: |
                Text inside an image is input like any other. A screenshot saying "ignore your
                instructions" can steer a model. Keep extraction instructions separate and
                don't give the extraction step any power to act.
            - title: Privacy
              body: |
                Receipts, IDs and screenshots contain personal data. Send only what's needed,
                know where the provider processes data, and redact what you store.

      - id: check-concepts
        type: quiz
        title: Check your understanding
        estimated_minutes: 4
        config:
          pass_score: 0.75
          questions:
            - id: resolution
              prompt: What usually happens when you send an image at a higher resolution?
              explanation: More image tokens means better legibility for small text, but more cost and latency.
              options:
                - { id: tokens, text: "More tokens: better detail, higher cost and latency", correct: true }
                - { id: free, text: "Nothing, images are a fixed price" }
                - { id: worse, text: "The model always gets less accurate" }
            - id: null-field
              prompt: The image is a landscape photo, not a receipt. What should your schema allow?
              explanation: A document-type field plus nullable fields gives the model an honest way to say "not applicable".
              options:
                - { id: zero, text: "total = 0" }
                - { id: nullable, text: "document_type = other and total = null", correct: true }
                - { id: error, text: "Crash, so the user retries" }
            - id: validate
              prompt: 'The model returned "total": "€ 23,85". What should your code do?'
              explanation: Normalize to a number (23.85) and validate it before using it.
              options:
                - { id: pass, text: "Pass the string on unchanged" }
                - { id: normalize, text: "Parse and normalize it to the number 23.85, then validate", correct: true }
                - { id: reject, text: "Always reject the whole result" }
            - id: injection
              prompt: Can text inside an image act as a prompt injection?
              explanation: Yes. Text in images is model input like any other.
              options:
                - { id: is-input, text: "Yes, text in images is input to the model", correct: true }
                - { id: ignored, text: "No, models ignore text in images" }

  - id: build
    title: Build the extractor
    steps:
      - id: contract
        type: code_example
        title: The extraction contract
        estimated_minutes: 4
        body: |
          Build an HTTP service with one endpoint, `POST /extract`. It receives
          `{"image": "data:image/png;base64,..."}` (PNG or JPEG) and responds with the JSON below.
          Use any vision-capable model.

          Rules:

          - `document_type` is `"receipt"` or `"other"`. For `other`, all other fields are `null`
            (and `line_items` is empty).
          - `date` is ISO 8601 (`YYYY-MM-DD`). `currency` is an ISO 4217 code (`EUR`, `USD`, …).
          - `total` and line item `amount`s are **numbers**, the total actually paid.
          - Validate the model's output before responding. If validation fails, retry once.
        config:
          snippets:
            - filename: response
              language: json
              code: |
                {
                  "document_type": "receipt",
                  "merchant": "Corner Coffee",
                  "date": "2026-01-31",
                  "currency": "EUR",
                  "total": 7.4,
                  "line_items": [
                    { "description": "Cappuccino", "amount": 3.7 },
                    { "description": "Cappuccino", "amount": 3.7 }
                  ]
                }
            - filename: schema.json
              language: json
              caption: A starting point for structured output.
              code: |
                {
                  "type": "object",
                  "required": ["document_type", "merchant", "date", "currency", "total", "line_items"],
                  "properties": {
                    "document_type": { "enum": ["receipt", "other"] },
                    "merchant": { "type": ["string", "null"] },
                    "date": { "type": ["string", "null"], "description": "YYYY-MM-DD" },
                    "currency": { "type": ["string", "null"], "description": "ISO 4217 code" },
                    "total": { "type": ["number", "null"] },
                    "line_items": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": ["description", "amount"],
                        "properties": { "description": { "type": "string" }, "amount": { "type": "number" } }
                      }
                    }
                  }
                }

      - id: extractor
        type: service_check
        title: Run the extraction checks
        estimated_minutes: 30
        body: |
          The platform sends three images you haven't seen: a clear receipt from a Dutch bakery,
          a slightly rotated receipt from a US hardware store, and something that isn't a
          receipt. The first must pass, plus at least one of the other two.

          Each image check verifies several fields at once: type, merchant, date, currency,
          total and line items.
        help: |
          Typical issues: the date isn't converted to YYYY-MM-DD; the total is returned as a string
          with a currency symbol; the currency is a symbol ("$") instead of a code; the model
          invents fields for the non-receipt image; the image is sent at too low a detail level to
          read small digits. Have the learner log the raw model output for each image and compare
          it to their validation rules.
        validation:
          timeout_ms: 60000
          parallel: true
          min_pass_ratio: 0.5
          cases:
            - id: bakery
              label: Extracts the bakery receipt
              request:
                method: POST
                path: /extract
                json: { image: "{{asset:receipt-bakery.png}}" }
              expect:
                json:
                  - { pointer: /document_type, equals: receipt }
                  - { pointer: /merchant, contains: lumen }
                  - { pointer: /date, equals: "2026-03-14" }
                  - { pointer: /currency, equals: EUR }
                  - { pointer: /total, type: number, approx: 23.85, tolerance: 0.001 }
                  - { pointer: /line_items, min_items: 4 }
                  - { pointer: "/line_items/*/amount", type: number }
            - id: hardware
              label: Extracts the rotated hardware store receipt
              graded: true
              request:
                method: POST
                path: /extract
                json: { image: "{{asset:receipt-hardware.png}}" }
              expect:
                json:
                  - { pointer: /document_type, equals: receipt }
                  - { pointer: /merchant, contains: northgate }
                  - { pointer: /date, equals: "2026-05-02" }
                  - { pointer: /currency, equals: USD }
                  - { pointer: /total, type: number, approx: 118.40, tolerance: 0.001 }
            - id: not-a-receipt
              label: Recognizes an image that isn't a receipt
              graded: true
              request:
                method: POST
                path: /extract
                json: { image: "{{asset:chart-visitors.png}}" }
              expect:
                json:
                  - { pointer: /document_type, equals: other }
                  - { pointer: /total, absent: true }

  - id: wrap-up
    title: Wrap up
    steps:
      - id: reflection
        type: free_text
        title: Ship it responsibly
        optional: true
        estimated_minutes: 3
        config:
          prompt: Your extractor will process real customer receipts. Name two measures you'd add before going to production and why.
        validation:
          min_words: 25
          required_concepts:
            - label: privacy, review or monitoring
              any_of: [privacy, personal, redact, review, human, monitor, confidence, audit, retention]
      - id: finish
        type: automatic_completion
        title: Your model can see
        depends_on: [extractor]
        body: |
          You turned pixels into validated data. The RAG course combines models with your own
          knowledge base.
